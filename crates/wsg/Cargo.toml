[package]
name = "wsg"
version = "0.19.0"
edition = "2024"
license = "GPL-3.0-or-later"
# Compatibility binary only: built from this repository and shipped in the
# release bundle, but not a crates.io artifact. `jjfx` is the published crate.
publish = false

[dependencies]
anyhow = "1"
jiff = "0.2"
jjfx = { path = "../.." }

[dev-dependencies]
jjfx = { path = "../..", features = ["test-support"] }
portable-pty = "0.9"
rustix = { version = "1", features = ["fs", "process"] }
serde_json = "1"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
