[workspace]
members = ["crates/wsg"]
resolver = "3"

[package]
name = "jjfx"
version = "0.53.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "A terminal UI for working with Jujutsu (jj) workspaces and the coding agents editing them"
repository = "https://github.com/Jarvvski/jjfx"
readme = "README.md"
keywords = ["jujutsu", "jj", "tui", "workspaces", "agents"]
categories = ["command-line-utilities", "development-tools"]
# The project pins its toolchain in rust-toolchain.toml and mise.toml; this is
# the version the suite is verified against, not a hand-computed minimum.
rust-version = "1.97"
# Keep the published crate to what a `cargo install` consumer needs: agent
# state, local planning notes, CI config, and the compatibility binary (which
# has its own workspace member) are not part of the library or the binary.
exclude = [
  ".agents/",
  ".claude/",
  ".github/",
  ".mise/",
  ".momo/",
  ".pi-subagents/",
  ".scratch/",
  "crates/",
  "momo.toml",
  # `rust-version` already states the toolchain floor; shipping the pin would
  # make `cargo install` download a specific toolchain instead.
  "rust-toolchain.toml",
]

[features]
test-support = []

# Keep local development and test artifacts small. Release builds are used by
# the normal mise run/build tasks, while tests retain their separate profile.
[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[dependencies]
anyhow = "1"
jiff = "0.2"
# Absorbed with wsg-core (the crate is gone; its engine lives in src/engine):
# the state store and worker pool need OS file/process primitives and atomic
# temp files, and every engine error type is a thiserror enum. The foreground
# Run handover needs terminal job control (`termios`), and the PTY test that
# proves the handover needs `pty` and `stdio`.
getrandom = "0.4"
rustix = { version = "1", features = ["fs", "process", "pty", "stdio", "termios"] }
tempfile = "3"
# Restores the terminal when a fatal signal (SIGINT/SIGTERM/SIGHUP) would
# otherwise kill the process with the alternate screen and raw mode still
# active. `unsafe` is forbidden crate-wide and `restore()` is not
# async-signal-safe, so the signal is delivered to a thread instead of handled
# in place. Not a new build dependency: crossterm already pulls signal-hook in.
signal-hook = "0.3"
thiserror = "2"
ratatui = "0.29"
ratatui-textarea = "0.8"
notify = "8"
# jj-lib reads the on-disk .jj store directly for the commit graph (ADR 0007),
# so its version must equal the `jj` mise pin (0.46.0) and upgrade in lockstep.
# pollster block_on's jj-lib's async RepoLoader inside spawn_blocking (spike 02).
jj-lib = "0.46.0"
pollster = "0.4"
# The DAG column/edge renderer jj's own CLI uses for `jj log`, so the world
# graph lays out exactly like jj's. Version matches the jj 0.46.0 workspace pin.
sapling-renderdag = "0.1.0"
serde = { version = "1", features = ["derive"] }
# arbitrary_precision preserves Go-compatible numeric fidelity when the engine
# round-trips the persisted wire documents it reads and writes.
serde_json = { version = "1", features = ["arbitrary_precision"] }
# default-fancy swaps onig (a C dependency) for the pure-Rust fancy-regex engine,
# keeping the build free of a C toolchain. syntect highlights diffs in-process,
# replacing the original bat pipe (ADR 0007).
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
# jjfx's own config file (~/.config/jjfx/config.toml); parsed once at startup.
toml = "0.8"

[lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
