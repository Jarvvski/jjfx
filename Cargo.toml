[workspace]
resolver = "3"

[package]
name = "jjfx"
version = "0.55.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "A terminal UI for working with Jujutsu (jj) workspaces and the coding agents editing them"
repository = "https://github.com/Jarvvski/jjfx"
homepage = "https://github.com/Jarvvski/jjfx"
readme = "README.md"
keywords = ["jujutsu", "jj", "tui", "workspaces", "agents"]
categories = ["command-line-utilities", "development-tools"]
# The project pins its toolchain in mise.toml; this is the version the suite is
# verified against, not a hand-computed minimum.
rust-version = "1.97"
# Keep the published crate to what a `cargo install` consumer needs: agent
# state, local planning notes, and CI config are not part of the library or the
# binary.
exclude = [
  ".agents/",
  ".claude/",
  ".github/",
  ".mise/",
  ".momo/",
  ".scratch/",
  "crates/",
  "momo.toml",
]

[features]
test-support = []

# `debug = 0` keeps local development and test artifacts small without slowing
# the build (release builds are used by the normal mise run/build tasks, while
# tests retain their separate profile). `incremental` stays on: it only affects
# this crate's own recompiles, and it is what makes an edit-to-rebuild cycle
# fast - turning it off made every `src/lib.rs` edit recompile the whole crate.
[profile.dev]
debug = 0
incremental = true

[profile.test]
debug = 0
incremental = true

[dependencies]
anyhow = "1"
jiff = "0.2"
# The engine's state store and worker pool need OS file/process primitives and
# atomic temp files, and every engine error type is a thiserror enum. The
# foreground Run handover needs terminal job control (`termios`), and the PTY
# test that proves the handover needs `pty` and `stdio`.
getrandom = "0.4"
rustix = { version = "1", features = ["fs", "process", "pty", "stdio", "termios"] }
tempfile = "3"
# Restores the terminal when a fatal signal (SIGINT/SIGTERM/SIGHUP) would
# otherwise kill the process with the alternate screen and raw mode still
# active. `unsafe` is forbidden crate-wide and `restore()` is not
# async-signal-safe, so the signal is delivered to a thread instead of handled
# in place. Not a new build dependency: crossterm already pulls signal-hook in.
signal-hook = "0.3"
thiserror = "2"
ratatui = "0.29"
ratatui-textarea = "0.8"
notify = "8"
# jj-lib reads the on-disk .jj store directly for the commit graph (ADR 0007),
# so its version must equal the `jj` mise pin (0.46.0) and upgrade in lockstep.
# pollster block_on's jj-lib's async RepoLoader inside spawn_blocking (spike 02).
jj-lib = "0.46.0"
pollster = "0.4"
# The DAG column/edge renderer jj's own CLI uses for `jj log`, so the world
# graph lays out exactly like jj's. Version matches the jj 0.46.0 workspace pin.
sapling-renderdag = "0.1.0"
serde = { version = "1", features = ["derive"] }
# arbitrary_precision preserves exact numeric fidelity when the engine
# round-trips the persisted wire documents it reads and writes.
serde_json = { version = "1", features = ["arbitrary_precision"] }
# default-fancy swaps onig (a C dependency) for the pure-Rust fancy-regex engine,
# keeping the build free of a C toolchain. syntect highlights diffs in-process,
# replacing the original bat pipe (ADR 0007).
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
# jjfx's own config file (~/.config/jjfx/config.toml); parsed once at startup.
toml = "0.8"
# The lifecycle verbs (`pool create` / `pool destroy`) are the first thing that
# *writes* a config file. `toml_edit` edits one table in place and keeps the
# rest of the document - comments, key order, formatting - verbatim, which a
# parse-then-serialise round trip would discard. Same version `toml` already
# depends on, so it adds no new crate to the tree.
toml_edit = "0.22"

[dev-dependencies]
# The spend fixtures seed a Run record that has to fall inside the *default*
# rolling spend window, so they stamp "now" rather than a fixed date that ages
# out of it and silently stops the cap from refusing (ticket 47).
jiff = "0.2"

[lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
