[tools]
rust = "1.97.1"
# Versioning and changelog are momo's job (see docs/releasing.md). Pin the CLI
# so `mise run check` and the release workflow resolve the same binary.
"github:Jarvvski/momo" = "0.6.0"
# jj-lib reads the on-disk .jj store directly, so jjfx is version-coupled to the
# jj binary's store format (ADR 0007). Pin jj to the version jj-lib targets and
# upgrade them in lockstep.
jj = "0.46.0"
# Cross-compilation toolchain for `mise run release`. zig is the C cross-linker
# cargo-zigbuild drives; together they build Linux (musl/gnu) and both macOS
# arches from this host without Docker (cross/Docker cannot target apple-darwin).
zig = "0.16.0"
"cargo:cargo-zigbuild" = "0.23.0"

[tasks.run]
description = "Run the jjfx TUI"
run = "cargo run --release -p jjfx -- tui"

[tasks.build]
description = "Build every workspace package"
run = "cargo build --release --workspace"

[tasks.test]
description = "Run tests for every workspace package"
run = "cargo test --workspace"

[tasks.clean-check]
description = "Remove all Cargo artifacts after verification"
run = "cargo clean"

[tasks.fmt]
description = "Format all code"
run = "cargo fmt --all"

[tasks.lint]
description = "Clippy across every workspace package, warnings as errors"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.check]
description = "changelog validation + fmt + lint + build + test + cleanup (the pre-land gate)"
# JJFX_KEEP_TARGET skips the cleanup for callers that still need the build
# cache afterwards - the release workflow builds archives straight after the
# gate, and a cold cross-compile of the whole tree is pure waste.
# `momo status` is the changelog check: it fails on a changelog momo cannot read
# (a duplicate Unreleased heading) and passes when nothing is unreleased.
run = "trap 'status=$?; [ -n \"${JJFX_KEEP_TARGET:-}\" ] || cargo clean; exit \"$status\"' EXIT; momo status >/dev/null && mise run fmt && mise run lint && mise run build && mise run test"
