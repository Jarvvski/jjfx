[tools]
rust = "1.96.1"
# jj-lib reads the on-disk .jj store directly, so jjfx is version-coupled to the
# jj binary's store format (ADR 0007). Pin jj to the version jj-lib targets and
# upgrade them in lockstep. Spike 02 confirmed jj 0.43.0 <-> jj-lib 0.43.0.
jj = "0.43.0"
# Cross-compilation toolchain for `mise run release`. zig is the C cross-linker
# cargo-zigbuild drives; together they build Linux (musl/gnu) and both macOS
# arches from this host without Docker (cross/Docker cannot target apple-darwin).
zig = "0.16.0"
"cargo:cargo-zigbuild" = "0.23.0"

[tasks.run]
description = "Run the jjfx TUI"
run = "cargo run -p jjfx -- tui"

[tasks.build]
description = "Build every workspace package"
run = "cargo build --workspace"

[tasks.wsg-test-install]
description = "Install Rust wsg into an isolated repository-local target"
run = "mkdir -p target/wsg-test-install/bin && cargo build -p wsg && cp target/debug/wsg target/wsg-test-install/bin/wsg"

[tasks.test]
description = "Run tests for every workspace package"
run = "cargo test --workspace"

[tasks.conformance]
description = "Run Go/Rust wsg conformance with explicit Go oracle binaries"
run = "test -x \"${WSG_GO_BINARY:-}\" && test -x \"${WSG_GO_TEST_BINARY:-}\" && cargo test -p wsg --test conformance -- --include-ignored --test-threads=1"

[tasks.fmt]
description = "Format all code"
run = "cargo fmt --all"

[tasks.lint]
description = "Clippy across every workspace package, warnings as errors"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.check]
description = "fmt + lint + build + test (the pre-land gate)"
run = [
  { task = "fmt" },
  { task = "lint" },
  { task = "build" },
  { task = "test" },
]
