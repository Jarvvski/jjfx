[tools]
# Rust is rustup's job, not mise's: the toolchain pin (and its clippy/rustfmt
# components) lives in rust-toolchain.toml, which rustup honours. A mise `rust`
# entry also resolves to ~/.cargo/bin and shims every binary there - cargo,
# rustc, jjfx - and a shim for a tool that is not active in the current config
# fails outright instead of falling through to the real binary.
# Versioning and changelog are momo's job (see docs/releasing.md). Pin the CLI
# so `mise run check` and the release workflow resolve the same binary.
"github:Jarvvski/momo" = "0.6.0"
# jj-lib reads the on-disk .jj store directly, so jjfx is version-coupled to the
# jj binary's store format (ADR 0007). Pin jj to the version jj-lib targets and
# upgrade them in lockstep.
jj = "0.46.0"
# Cross-compilation toolchain for `mise run release`. zig is the C cross-linker
# cargo-zigbuild drives; together they build Linux (musl/gnu) and both macOS
# arches from this host without Docker (cross/Docker cannot target apple-darwin).
zig = "0.16.0"
"cargo:cargo-zigbuild" = "0.23.0"

[tasks.run]
description = "Run the jjfx TUI"
run = "cargo run --release -p jjfx -- tui"

[tasks.dev]
description = "Run the jjfx TUI from a debug build (fast rebuild loop)"
# Debug renders slower than release, so `run` stays optimized for real use;
# this is the loop to iterate in, where an edit costs ~2s instead of ~10s.
run = "cargo run -p jjfx -- tui"

[tasks.build]
description = "Build every workspace package"
run = "cargo build --release --workspace"

[tasks.test]
description = "Run tests for every workspace package"
# JJFX_TEST_SIGNING_OFF makes the engine's jj invocations pass
# `--config signing.behavior=drop`. Integration tests compile the crate without
# `cfg(test)`, so without it they would sign their throwaway commits and the
# suite would depend on the developer's GPG key being unlocked.
run = "JJFX_TEST_SIGNING_OFF=1 cargo test --workspace"

[tasks.clean-check]
description = "Remove all Cargo artifacts after verification"
run = "cargo clean"

[tasks.fmt]
description = "Format all code"
run = "cargo fmt --all"

[tasks.lint]
description = "Clippy across every workspace package, warnings as errors"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.check]
description = "changelog validation + fmt + lint + build + test (the pre-land gate)"
# `momo status` is the changelog check: it fails on a changelog momo cannot read
# (a duplicate Unreleased heading) and passes when nothing is unreleased.
# The gate deliberately leaves the build cache intact: `cargo clean` here made
# every following build a cold one (~45s of recompiling 343 crates) and bought
# nothing on CI's ephemeral runners. Use `mise run clean-check` to drop artifacts.
run = "momo status >/dev/null && mise run fmt && mise run lint && mise run build && mise run test"
