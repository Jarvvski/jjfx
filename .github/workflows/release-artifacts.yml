name: Release artifacts

# Owner-controlled: builds inspectable jjfx archives for the supported
# target matrix and uploads them as workflow artifacts. It never publishes a
# release, creates a tag, or promotes anything - trigger it manually from the
# Actions tab.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  artifacts:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          # Rustup components live outside mise's cached data directory.
          cache: false
      - uses: Swatinem/rust-cache@v2
      - name: Build release archives
        run: mise run release aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-musl
      - name: Upload archives
        uses: actions/upload-artifact@v4
        with:
          name: jjfx-release-archives
          path: dist/*.tar.gz*
          if-no-files-found: error
