name: Release

# Owner-controlled release, dispatched by hand. momo derives the next version
# from the unreleased CHANGELOG entries and the latest tag, writes the
# changelog, the version ledger and the manifest, and tags the release; this
# workflow builds the release archives, publishes jjfx to crates.io, and cuts
# the GitHub Release.
#
# `workflow_dispatch` only runs from the default branch, so this file has to be
# on `main` before it can be dispatched at all.
#
# The `release` environment gates publishing: it holds CARGO_REGISTRY_TOKEN and
# requires a reviewer, so a real release needs an approval click on top of the
# dispatch. That approval is the gate, so `dry_run` defaults to false - an
# ordinary release does not pay for a rehearsal. Pass `-f dry_run=true` when the
# release process itself changed.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Stop before building, committing, tagging, publishing, or releasing"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          # momo reads the current version from the tags.
          fetch-depth: 0
      - uses: jdx/mise-action@v2
        with:
          # Rustup components live outside mise's cached data directory.
          cache: false
      - uses: Swatinem/rust-cache@v2

      # The canonical gate, before anything irreversible. It leaves the build
      # cache in place, which the archive build below reuses.
      - name: Pre-land gate
        run: mise run check

      - name: Derive the next version
        id: version
        run: |
          set -euo pipefail
          if ! momo status --check >/dev/null 2>&1; then
            echo "error: nothing unreleased - record a change with 'momo break|add|fix'" >&2
            exit 1
          fi
          version="$(momo status --version-only)"

          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "error: tag v$version already exists" >&2
            exit 1
          fi
          if curl -sf -A "jjfx-release-workflow" \
              "https://crates.io/api/v1/crates/jjfx/$version" >/dev/null; then
            echo "error: jjfx $version is already published on crates.io" >&2
            exit 1
          fi

          echo "derived $version"
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Mint the release
        # momo writes CHANGELOG.md, .momo/version and the Cargo.toml version
        # scalar. It never touches Cargo.lock, so sync it here: `cargo publish
        # --locked` fails outright on a stale workspace version entry.
        run: |
          set -euo pipefail
          momo release
          cargo metadata --format-version 1 >/dev/null

      - name: Verify the package without publishing
        # The mint above is deliberately uncommitted at this point, so the
        # checkout is dirty by design; --allow-dirty packages exactly what the
        # commit below will record.
        run: cargo publish --dry-run --locked --allow-dirty

      - name: Summarise the dry run
        if: inputs.dry_run
        run: |
          echo "dry run: would release ${{ steps.version.outputs.version }}"
          git --no-pager diff --stat

      # Built before anything is committed, so a failed cross-compile leaves a
      # dirty checkout rather than a tag pointing at an unpublished release.
      - name: Build the release archives
        if: ${{ !inputs.dry_run }}
        run: mise run release aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-musl

      - name: Commit and tag
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          branch="${{ github.ref_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md .momo/version
          git commit -m "Release $version"

          # The gate and the cross-compile above take roughly 13 minutes, so a
          # concurrent session can land commits on the branch while this run is
          # in flight. Rebase the release commit onto the latest tip and push,
          # retrying a bounded number of times when another commit wins the race
          # between the fetch and the push.
          attempts=5
          for attempt in $(seq 1 "$attempts"); do
            git fetch origin "$branch"
            if ! git rebase "origin/$branch"; then
              git rebase --abort || true
              echo "error: could not rebase the release commit onto origin/$branch" >&2
              echo "error: a concurrently recorded CHANGELOG.md entry most likely conflicts; resolve it by hand and re-dispatch - never force the push, which would drop that entry" >&2
              exit 1
            fi
            # Push the branch before the tag: a rejected branch push must never
            # orphan the tag, which would otherwise point at a commit that is
            # not on the branch and block a clean re-run.
            if git push origin "HEAD:$branch"; then
              # momo tags the version its ledger just minted, anchored to HEAD -
              # the rebased release commit.
              momo tag
              git push origin "refs/tags/v$version"
              exit 0
            fi
            echo "push to $branch was rejected; retrying ($attempt/$attempts)" >&2
          done
          echo "error: could not push the release commit to $branch after $attempts attempts" >&2
          exit 1

      # Publish before creating the Release: a failed publish then leaves a tag
      # but no release, which is recoverable. The reverse would leave a public
      # release pointing at a crate version that does not exist.
      - name: Publish to crates.io
        if: ${{ !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

      - name: Create the GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          momo notes --output RELEASE_NOTES.md
          gh release create "v$version" \
            --title "v$version" \
            --notes-file RELEASE_NOTES.md \
            dist/*.tar.gz dist/*.tar.gz.sha256
